<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>DaiBodyCare</title>
    <meta name="theme-color" content="#7C3AED">
    <meta name="description" content="Cuidado Corporal y Facial">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <a class="visually-hidden-focusable" href="#app-root">Saltar al contenido</a>

    <!-- Top bar: quick actions only — branding lives in the hero below -->
    <header class="brand-nav sticky-top">
        <div class="container d-flex align-items-center justify-content-end py-2 gap-2">
            <a id="ig-link" href="#" target="_blank" rel="noopener" class="icon-btn" aria-label="Instagram" style="display:none;">
                <i class="bi bi-instagram" aria-hidden="true"></i>
            </a>
            <a id="wa-nav-link" href="#" target="_blank" rel="noopener" class="icon-btn" aria-label="WhatsApp" style="display:none;">
                <i class="bi bi-whatsapp" aria-hidden="true"></i>
            </a>
            <a id="maps-link" href="#" target="_blank" rel="noopener" class="icon-btn" aria-label="Ubicación" style="display:none;">
                <i class="bi bi-geo-alt" aria-hidden="true"></i>
            </a>
        </div>
    </header>

    <!-- Hero: logo + name + tagline live here, once, front and center -->
    <div class="hero-strip">
        <div class="container">
            <div class="hero-brand">
                <img id="hero-logo" src="assets/logo-placeholder.svg" alt="Logo" class="hero-logo">
                <p id="hero-eyebrow" class="hero-eyebrow mb-0"></p>
                <h1 id="hero-title" class="hero-title">&nbsp;</h1>
                <p id="hero-sub" class="hero-sub mb-0"></p>
            </div>
        </div>
    </div>

    <!-- Main content, filled by renderers.js -->
    <div id="app-root">
        <div class="container py-4">
            <div class="skeleton skeleton-line" style="width: 40%;"></div>
            <div class="skeleton skeleton-line" style="width: 90%;"></div>
            <div class="skeleton skeleton-line" style="width: 70%;"></div>
            <div class="skeleton skeleton-card mt-4"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="fw-semibold mb-1" id="footer-business"></div>
            <p class="mb-1" id="footer-location" style="display:none;">
                <a id="footer-address" href="#" target="_blank" rel="noopener">
                    <i class="bi bi-geo-alt me-1" aria-hidden="true"></i>
                </a>
            </p>
            <p class="mb-1">
                <a id="footer-whatsapp" href="#" target="_blank" rel="noopener" style="display:none;">
                    <i class="bi bi-whatsapp me-1" aria-hidden="true"></i>WhatsApp
                </a>
            </p>
            <p class="mb-0">
                <a id="footer-instagram" href="#" target="_blank" rel="noopener" style="display:none;">
                    <i class="bi bi-instagram me-1" aria-hidden="true"></i>Instagram
                </a>
            </p>
            <p class="mt-3 mb-0">
                Desarrollado por
                <a href="https://instagram.com/domindex.dev"
                   target="_blank"
                   rel="noopener">
                    DOMINDEX
                </a>
            </p>
        </div>
    </footer>

    <!-- Cart FAB -->
    <button type="button" id="cart-fab" class="cart-fab d-none" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" aria-controls="cartOffcanvas" aria-label="Ver carrito">
        <i class="bi bi-bag" aria-hidden="true"></i>
        <span class="fab-label">Ver pedido</span>
        <span class="cart-fab-badge tabular-nums" id="cart-fab-count">0</span>
    </button>

    <!-- Back to top -->
    <button type="button" id="back-to-top" class="back-to-top" aria-label="Volver arriba">
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </button>

    <!-- Cart offcanvas -->
    <div class="offcanvas offcanvas-end offcanvas-cart" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title" id="cartOffcanvasLabel" style="font-size:1.05rem; font-weight:600;">Tu pedido</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body" id="cart-offcanvas-body">
            <!-- filled by app.js -->
        </div>
    </div>

    <!-- Toasts -->
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" id="toast-container"></div>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
